name: "Pull Request Labeler"
on:
  pull_request_target:
    types: [opened]

jobs:
  apply-file-based-labels:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@v6
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
  apply-internal-external-label:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            // Anyone with write access to the repo is treated as internal.
            const user = context.payload.pull_request.user.login
            let internal = user === 'dependabot[bot]'
            if (!internal) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: user
              })
              internal = ['admin', 'maintain', 'write'].includes(data.permission)
            }
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: internal ? ['pr/internal'] : ['pr/external', 'stage/needs-triage']
            })
