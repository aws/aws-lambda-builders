version = 1
revision = 3
requires-python = ">=3.9"

[manifest]
members = [
    "workspace-app",
    "workspace-lib",
]

[[package]]
name = "workspace-app"
version = "0.1.0"
source = { virtual = "app" }
dependencies = [
    { name = "workspace-lib" },
]

[package.metadata]
requires-dist = [{ name = "workspace-lib", editable = "lib" }]

[[package]]
name = "workspace-lib"
version = "0.1.0"
source = { editable = "lib" }
