plugins {
    id 'java'
}

task extraArchive(type: Zip) {
    from 'src/main/java'
}

artifacts {
    archives extraArchive
}

build.dependsOn extraArchive

repositories {
    mavenCentral()
}

dependencies {
    implementation 'software.amazon.awssdk:annotations:2.1.0'
}

java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17
